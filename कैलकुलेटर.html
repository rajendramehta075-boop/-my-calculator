<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>कैलकुलेटर</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#1c2430;--mute:#6b7685;--key:#e6eaef;--op:#1f6f78;--opink:#fff;--eq:#e07a1f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--panel:#1b222b;--ink:#eef1f4;--mute:#97a3b3;--key:#27303b;--op:#2a8c97;--eq:#e8883a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--panel:#1b222b;--ink:#eef1f4;--mute:#97a3b3;--key:#27303b;--op:#2a8c97;--eq:#e8883a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.calc{width:100%;max-width:360px;background:var(--panel);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.screen{min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 6px 16px;overflow-x:auto}
.hist{color:var(--mute);font-size:16px;min-height:22px}
.cur{font-size:44px;font-weight:600;word-break:break-all;text-align:right}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{font:inherit;font-size:22px;height:64px;border:0;border-radius:14px;background:var(--key);color:var(--ink);cursor:pointer}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--eq);outline-offset:2px}
.op{background:var(--op);color:var(--opink)}
.eq{background:var(--eq);color:#fff}
.wide{grid-column:span 2}
</style>
</head>
<body>
<main class="calc">
  <div class="screen"><div class="hist" id="hist"></div><div class="cur" id="cur">0</div></div>
  <div class="keys" id="keys"></div>
</main>
<script>
var cur="0",prev=null,op=null,fresh=false;
var cEl=document.getElementById("cur"),hEl=document.getElementById("hist");
var layout=[["C","clr"],["⌫","del"],["%","pct"],["÷","op","/"],
["7"],["8"],["9"],["×","op","*"],
["4"],["5"],["6"],["−","op","-"],
["1"],["2"],["3"],["+","op","+"],
["0","wide"],["."],["=","eq"]];
var keys=document.getElementById("keys");
layout.forEach(function(k){
  var b=document.createElement("button");
  b.textContent=k[0];
  if(k[1]==="op"||k[1]==="eq"||k[1]==="wide")b.className=k[1];
  b.onclick=function(){press(k)};
  keys.appendChild(b);
});
function fmt(n){return String(parseFloat(n.toPrecision(12)))}
function show(){cEl.textContent=cur;hEl.textContent=prev!==null&&op?fmt(prev)+" "+sym(op):""}
function sym(o){return {"/":"÷","*":"×","-":"−","+":"+"}[o]}
function calc(a,b,o){
  if(o==="+")return a+b;
  if(o==="-")return a-b;
  if(o==="*")return a*b;
  if(o==="/")return b===0?null:a/b;
  return b;
}
function press(k){
  var t=k[0],type=k[1];
  if(cur==="गलती"){cur="0";prev=null;op=null}
  if(type==="clr"){cur="0";prev=null;op=null;fresh=false}
  else if(type==="del"){cur=cur.length>1?cur.slice(0,-1):"0"}
  else if(type==="pct"){cur=fmt(parseFloat(cur)/100)}
  else if(type==="op"){
    if(op&&!fresh){var r=calc(prev,parseFloat(cur),op);if(r===null){cur="गलती";op=null;prev=null;show();return}prev=r}
    else prev=parseFloat(cur);
    op=k[2];fresh=true;
  }
  else if(type==="eq"){
    if(op){var r2=calc(prev,parseFloat(cur),op);
      if(r2===null){cur="गलती"}else{cur=fmt(r2)}
      prev=null;op=null;fresh=true}
  }
  else{
    if(t==="."&&cur.indexOf(".")>-1&&!fresh)return;
    if(fresh){cur=t==="."?"0.":t;fresh=false}
    else cur=cur==="0"&&t!=="."?t:cur+t;
  }
  show();
}
document.addEventListener("keydown",function(e){
  var m={"Enter":"=","=":"=","Backspace":"⌫","Escape":"C","/":"÷","*":"×","-":"−","+":"+","%":"%"};
  var key=m[e.key]||e.key;
  for(var i=0;i<layout.length;i++){if(layout[i][0]===key){e.preventDefault();press(layout[i]);return}}
});
</script>
</body>
</html>
